name: Publish Heart Lamplighter preview
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published preview tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Poyueh/heart-lamplighter-demo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download the authorized public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+",os.environ["RELEASE_TAG"])'
          name="Heart-Lamplighter-H5-${RELEASE_TAG#v}.zip"
          gh release download "$RELEASE_TAG" --pattern "$name" --pattern SHA256SUMS.txt --dir incoming
          python3 tools/unpack_site.py "incoming/$name" --checksums incoming/SHA256SUMS.txt --output site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy the reviewed game and design book
        id: deployment
        uses: actions/deploy-pages@v4
